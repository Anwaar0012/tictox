name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A47CB1: ${{ secrets.A47CB1 }}
          B3ACC0: ${{ secrets.B3ACC0 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A47CB1', '')
          tag_b = os.environ.get('B3ACC0', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- f8fe624117aee53003cf7cd1fddf -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 64dc0d1d6050a80c0243b1d1bd -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
